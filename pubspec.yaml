name: roadbond
description: "A motorcycle group ride planning application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/app_logo.png"
  adaptive_icon_background: "#111214"
  adaptive_icon_foreground: "lib/assets/images/app_logo.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/